# Modalita' power user: nessun container Postgres. DATABASE_URL in .env deve puntare
# a un Postgres esterno gia' esistente, con un utente dedicato (non l'utente `postgres`).
# Uso: cp .env.example .env && modifica DATABASE_URL && docker compose -f docker-compose.external-db.yml up -d

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.main"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE}
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:
  storage:
