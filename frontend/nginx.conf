server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Secure headers (SPEC §52) — difesa in profondita' rispetto a quelli
    # applicati dal backend (app/core/security_headers.py): questi coprono
    # anche gli asset statici della SPA, che non passano mai da FastAPI.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stesso-origine verso il backend (nessun CORS da configurare, il
    # cookie httpOnly di refresh resta same-site) — "app" e' il nome del
    # servizio nella rete Docker Compose.
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
