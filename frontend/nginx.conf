# Log di accesso SENZA query string: `code` e `state` del callback Open Banking
# (e i termini di ricerca dell'utente) non devono restare nei log Docker. Niente
# referer: puo' contenere l'URL completo della pagina precedente.
log_format lumio_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

# HSTS solo se la richiesta e' arrivata dal reverse proxy in HTTPS (il browser
# lo ignorerebbe comunque su http); valore vuoto = header omesso.
map $http_x_forwarded_proto $lumio_hsts {
    default "";
    https   "max-age=63072000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log lumio_noquery;

    # IP reale del client: ci si fida di X-Forwarded-For SOLO se la richiesta
    # arriva da una rete privata (reverse proxy davanti a questo container).
    # Con `real_ip_recursive` conta l'ultimo indirizzo non fidato, quindi un
    # X-Forwarded-For inventato dal client non viene mai preso per buono.
    # Se il tuo reverse proxy ha un indirizzo pubblico, aggiungilo qui.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Secure headers (SPEC §52) — difesa in profondita' rispetto a quelli
    # applicati dal backend (app/core/security_headers.py): questi coprono
    # anche gli asset statici della SPA, che non passano mai da FastAPI.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security $lumio_hsts always;
    # CSP della SPA: niente script inline (il tema iniziale e' in /theme-init.js).
    # `style-src 'unsafe-inline'` serve agli attributi style di React.
    # Immagini solo dalla nostra origine: i loghi delle banche passano dal
    # proxy del backend (/api/v1/open-banking/logos), il browser non contatta
    # siti di terzi. Google (Picker/Drive) e' ammesso per le integrazioni
    # Google: senza GOOGLE_ENABLED si possono togliere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://apis.google.com https://*.googleapis.com; frame-src https://docs.google.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker e manifest PWA mai in cache del browser: un sw.js vecchio
    # bloccherebbe gli aggiornamenti dell'app. `expires -1` (Cache-Control:
    # no-cache) e NON `add_header`: un add_header in una location fa perdere
    # gli header di sicurezza ereditati dal server.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        expires -1;
    }

    # Stesso-origine verso il backend (nessun CORS da configurare, il
    # cookie httpOnly di refresh resta same-site) — "app" e' il nome del
    # servizio nella rete Docker Compose.
    location /api/ {
        # Il default nginx e' 1MB, sotto il limite applicativo di import
        # (MAX_IMPORT_FILE_SIZE_BYTES, 10MB per default): senza questa riga un
        # estratto conto PDF di 2MB prende un 413 QUI, prima di arrivare a
        # FastAPI, che quindi non puo' restituire il suo errore parlante.
        # Tenuto piu' alto del limite applicativo di proposito: il rifiuto per
        # dimensione deve arrivare dall'app (messaggio chiaro, evento di
        # import registrato), non dal proxy. Un eventuale reverse proxy
        # davanti a questo deve alzare a sua volta il proprio limite.
        client_max_body_size 20m;

        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        # $remote_addr e' gia' l'IP reale risolto dal modulo realip qui sopra:
        # si SOSTITUISCE l'header del client invece di accodarlo.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
