# Modalita' standard: Postgres e Redis inclusi nel compose.
# Uso: cp .env.example .env && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # POSTGRES_USER e' il nome richiesto dall'immagine ufficiale per il
      # ruolo bootstrap (sempre superuser). L'app NON lo usa mai: vedi
      # db/postgres-init/01-create-app-role.sh, che crea il ruolo applicativo
      # non-superuser effettivamente usato da DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      # Comodo per pytest/psql/GUI locali durante lo sviluppo. Non e' un
      # rischio nuovo: rimane dietro il ruolo applicativo non-superuser +
      # RLS; un power user che non lo desidera puo' rimuovere la riga.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["arq", "app.worker.main.WorkerSettings"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE}
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage:
