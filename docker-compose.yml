# Modalita' standard: Postgres e Redis inclusi nel compose.
# Uso: cp .env.example .env && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # POSTGRES_USER e' il nome richiesto dall'immagine ufficiale per il
      # ruolo bootstrap (sempre superuser). L'app NON lo usa mai: vedi
      # db/postgres-init/01-create-app-role.sh, che crea il ruolo applicativo
      # non-superuser effettivamente usato da DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      # Comodo per pytest/psql/GUI locali durante lo sviluppo. Solo loopback:
      # senza 127.0.0.1 il database sarebbe raggiungibile da tutta la rete
      # (Wi-Fi, ospiti) con la sola password a proteggerlo.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      # Password OPZIONALE di Redis. Se la imposti nel .env, `REDIS_URL` deve
      # diventare redis://:<password>@redis:6379/0 (stessa password). Vuota =
      # nessuna autenticazione (comportamento storico).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    ports:
      # Solo loopback: Redis non ha autenticazione, chi lo raggiunge legge e
      # manipola la coda dei job (e i lock di sincronizzazione bancaria).
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./backend
    env_file: .env
    ports:
      # Solo loopback: l'API raggiunta direttamente aggira nginx (header di
      # sicurezza, IP reale del client). Il traffico normale passa dal frontend.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["arq", "app.worker.main.WorkerSettings"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE}
        VITE_GOOGLE_PICKER_API_KEY: ${VITE_GOOGLE_PICKER_API_KEY}
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage:
