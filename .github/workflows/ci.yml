name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # POSTGRES_USER qui e' il ruolo bootstrap dell'immagine ufficiale
      # (sempre superuser). I test devono girare con un ruolo applicativo
      # separato, non-superuser, altrimenti la Row-Level Security non
      # verrebbe mai esercitata per davvero — vedi step "Create app role".
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: lumio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d lumio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://lumio_app:lumio_app_password@localhost:5432/lumio
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key
      # I test di tests/test_integrations_google_api.py richiedono che il
      # router Google sia montato, e il montaggio avviene UNA SOLA VOLTA
      # all'import di app.main (app/api/v1/router.py): senza GOOGLE_ENABLED
      # qui, quegli endpoint rispondono 404 e i test falliscono. I valori
      # sono fittizi di proposito: ogni chiamata verso Google e' mockata con
      # httpx_mock, nessun traffico reale esce dalla CI.
      GOOGLE_ENABLED: "true"
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:5173/api/v1/integrations/google/callback
      GOOGLE_PICKER_API_KEY: ci-picker-key

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Create non-superuser app role (richiesto per la RLS)
        env:
          PGPASSWORD: ci_admin_password
        run: |
          psql -h localhost -U ci_admin -d lumio -v ON_ERROR_STOP=1 <<-'EOSQL'
              CREATE ROLE lumio_app WITH LOGIN PASSWORD 'lumio_app_password'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
              CREATE ROLE lumio_rls_helper
                  WITH NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION BYPASSRLS;
              GRANT lumio_rls_helper TO lumio_app;
              GRANT ALL PRIVILEGES ON DATABASE lumio TO lumio_app;
              GRANT ALL ON SCHEMA public TO lumio_app;
              GRANT CREATE ON SCHEMA public TO lumio_rls_helper;
          EOSQL

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
